name: $95 Workflow Rescue Sprint
description: Describe one broken or manual workflow for a fixed starter rescue.
title: "[Workflow rescue] "
labels:
  - pilot-inquiry
body:
  - type: markdown
    attributes:
      value: |
        This form is for a fixed $95 starter sprint: one input, one output, one main
        failure path, and delivery within three business days.

        Please do not include production credentials, API keys, private customer records, regulated data, payment details, or confidential business data. Use fictional, redacted, or high-level examples only.
  - type: textarea
    id: workflow
    attributes:
      label: What is broken or still manual?
      description: Describe the workflow and the specific point where it fails or consumes time.
      placeholder: "Example: inbound form submissions need to be validated, scored, and routed to a spreadsheet plus Slack alert."
    validations:
      required: true
  - type: dropdown
    id: pilot_type
    attributes:
      label: Best-fit rescue
      description: Pick the closest starting point.
      options:
        - Broken workflow repair
        - Manual workflow prototype
        - Data extraction or cleanup
        - Small app or script bug
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input source
      description: What starts the workflow?
      placeholder: "Webhook, CSV export, Google Sheet, CRM export, inbox export, form submission, API payload..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Desired output
      description: What should the workflow produce?
      placeholder: "Clean spreadsheet, JSON summary, CRM update, draft for human review, report, notification..."
    validations:
      required: true
  - type: dropdown
    id: stack
    attributes:
      label: Preferred implementation style
      options:
        - n8n workflow
        - Python script
        - Hybrid n8n plus Python/API
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Up to three failing examples
      description: Use fictional, redacted, or high-level examples. Do not include secrets or private records.
      placeholder: "Example 1: a duplicate form submission creates two rows. Example 2: a missing email crashes the run."
    validations:
      required: true
  - type: textarea
    id: systems
    attributes:
      label: Systems involved
      description: List tools by name only. Do not include credentials or private URLs.
      placeholder: "OpenAI, Google Sheets, Airtable, HubSpot, Slack, internal REST API, CSV files..."
    validations:
      required: false
  - type: textarea
    id: edge_cases
    attributes:
      label: Edge cases or failure modes
      description: What goes wrong today?
      placeholder: "Duplicate rows, missing fields, malformed exports, API timeouts, unclear routing rules..."
    validations:
      required: false
  - type: dropdown
    id: data_safety
    attributes:
      label: Data boundary for first pilot
      options:
        - Fictional sample data
        - Redacted sample data
        - Sandbox/test account data
        - Needs discussion before sharing anything
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How would you judge the first pilot?
      placeholder: "Example: one test payload produces the expected spreadsheet row, review draft, and error log."
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Preferred contact route
      description: Optional. You can also email directly from the portfolio page.
      placeholder: "Email or preferred public contact route"
    validations:
      required: false
